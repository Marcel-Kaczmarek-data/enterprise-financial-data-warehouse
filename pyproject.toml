[project]
name = "enterprise-financial-data-warehouse"
version = "0.1.0"
description = "Production-style enterprise financial data warehouse: Snowflake/DuckDB, dbt, Airflow, S3/MinIO, financial reconciliation and consolidation."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Enterprise Financial Data Warehouse contributors" }]

[tool.setuptools.packages.find]
include = ["data_generator*", "ingestion*", "source_systems*", "warehouse*", "data_quality*", "dashboards*", "finance_common*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["dbt_finance/target", "dbt_finance/dbt_packages", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PTH", "DTZ"]
ignore = ["RUF001", "RUF002", "RUF003", "PTH123", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ"]
"orchestration/**" = ["DTZ"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["dbt_finance/", "orchestration/", ".venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires local Docker services (PostgreSQL, MinIO) or a built warehouse",
    "financial: financial correctness tests against the built warehouse",
    "end_to_end: full pipeline scenarios",
    "performance: benchmark-style tests (opt-in)",
    "snowflake: requires real Snowflake credentials (skipped otherwise)",
]

[tool.coverage.run]
source = ["data_generator", "ingestion", "source_systems", "warehouse", "data_quality", "finance_common"]
omit = ["*/__main__.py"]

[tool.sqlfluff.core]
dialect = "duckdb"
templater = "jinja"
max_line_length = 120
exclude_rules = ["LT05", "ST06", "AM04", "RF04", "ST05", "CV03"]

[tool.sqlfluff.templater.jinja]
apply_dbt_builtins = true
load_macros_from_path = "dbt_finance/macros"

[tool.sqlfluff.indentation]
tab_space_size = 4

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "lower"

[tool.sqlfluff.rules.capitalisation.functions]
extended_capitalisation_policy = "lower"
