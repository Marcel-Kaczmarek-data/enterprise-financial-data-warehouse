# No secrets in this file: every credential is read from the environment.
finance:
  target: "{{ env_var('DBT_TARGET', 'local') }}"
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('FDW_WAREHOUSE_PATH', '../warehouse/local/finance.duckdb') }}"
      schema: finance_core
      threads: 4
      settings:
        TimeZone: UTC
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'not-configured') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'not-configured') }}"
      authenticator: "{{ env_var('SNOWFLAKE_AUTHENTICATOR', 'snowflake_jwt') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'ANALYTICS_ENGINEER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'FINANCE_TRANSFORM_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'FINANCE_DW') }}"
      schema: FINANCE_CORE
      threads: 8
      query_tag: "dbt_finance"
